<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>解锁工作台 · Telegram Sync</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/workbench-login.css') }}"
    />
  </head>
  <body>
    <main class="login-surface">
      <a class="login-brand" href="/files"
        ><span aria-hidden="true">↓</span>
        <div>媒体工作台<small>TELEGRAM SYNC</small></div></a
      >
      <section class="login-panel" aria-labelledby="login-title">
        <div class="login-mark" aria-hidden="true">
          <svg
            width="25"
            height="25"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <rect x="5" y="10" width="14" height="11" rx="3" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3" />
          </svg>
        </div>
        <h1 id="login-title">解锁你的工作台</h1>
        <p class="login-description">输入管理密码，继续浏览资源与管理同步。</p>
        <form id="login-form" method="post" action="{{ url_for('login') }}">
          <label for="password">管理密码</label>
          <div class="password-field">
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
              autofocus
              placeholder="输入管理密码"
            /><button
              type="button"
              id="toggle-password"
              aria-label="显示密码"
              aria-pressed="false"
            >
              显示
            </button>
          </div>
          <p id="login-error" role="alert" {% if not login_error %}hidden{% endif %}>{{ login_error or '' }}</p>
          <button type="submit" id="login-submit" aria-label="解锁工作台">
            解锁工作台 <span aria-hidden="true">→</span>
          </button>
        </form>
        <p class="login-note">这是工作台管理密码，不是 Telegram 登录密码。</p>
      </section>
    </main>
    <script src="{{ url_for('static', filename='aes/crypto-js-master/crypto-js.js') }}"></script>
    <script src="{{ url_for('static', filename='login/workbench-login.js') }}"></script>
  </body>
</html>
